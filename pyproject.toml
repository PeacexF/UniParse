[project]
name = "uniparse"
version = "0.1.0"
description = "Universal parser: extract structured data from arbitrary websites with little or no per-site configuration."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Peace" }]
keywords = ["scraping", "parser", "extraction", "playwright", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "lxml>=5.2",
    "cssselect>=1.2",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "lxml-stubs>=0.5",
    "types-python-dateutil>=2.9",
]

[project.scripts]
uparse = "uparse.cli:main"

[project.urls]
Homepage = "https://github.com/PeacexF/UniParse"
Issues = "https://github.com/PeacexF/UniParse/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uparse"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "PTH",       # pathlib
    "TID",       # tidy imports
    "RUF",       # ruff
]
ignore = [
    "E501",      # line length is handled by the formatter
    "B008",      # click idioms use calls in defaults
    "RUF001",    # ambiguous unicode in extraction patterns is deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["uparse"]

[tool.mypy]
python_version = "3.14"
files = ["src/uparse"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cssselect.*", "dateutil.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "browser: requires the built TypeScript Playwright worker and Chromium",
    "slow: slower integration test",
]
filterwarnings = ["error::DeprecationWarning:uparse.*"]

[tool.coverage.run]
source = ["src/uparse"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
